services:
  - type: web
    name: interviewgpt
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLY_AI_API_KEY
        sync: false
